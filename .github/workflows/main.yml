name: Pipeline de CI/CD - TMDB

on:
    push:
        branches: ["release"]
    workflow_dispatch:

# Permissões necessárias para o deploy no GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false


jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
            - name: Baixar o código do repositório
              uses: actions/checkout@v4

            - name: Configurar ambiente Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '20'
                cache: 'npm' # Acelera a instalaçaõ de dependências

            - name: Instalar dependências
              run: npm ci

            - name: Executar testes
              run: npm test

            - name: Criar arquivo .env
              run: echo "EXPO_PUBLIC_TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" > .env

            - name: Executa comando de exportação na plataforma Web
              run: npx expo export --platform web

            - name: Arquivo vazio .nojekyll
              run: touch dist/.nojekyll

            - name: Upload artifac GitHub Pages
              uses: actions/upload-pages-artifact@v3
              with:
                path: ./dist


    deploy:
      needs: build-and-test
      runs-on: ubuntu-latest
      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}
      steps:
        - name: Deploy para GitHub Pages
          id: deployment
          uses: actions/deploy-pages@v4


    build-android:
      needs: build-and-test
      runs-on: ubuntu-latest

      steps:
        - uses: actions/checkout@v4

        - name: Configurar o Node.js
          uses: actions/setup-node@v4
          with:
              node-version: '20'
              cache: 'npm'

        - name: Instalar dependências
          run: npm ci

        - name: Configurar o JDK 17
          uses: actions/setup-java@v4
          with:
              java-version: '17'
              distribution: 'temurin'
              cache: 'gradle'

        - name: Expo Prebuild (Gerar pasta /android)
          run: npx expo prebuild --platform android

        - name: Permissão de execução pro arquivo gradlew 
          run: chmod +x android/gradlew

        - name: APK de release android 
          run: |
            cd android
            ./gradlew assembleRelease

        - name: Upload do artefato APK
          uses: actions/upload-artifact@v4
          with: 
            name: app-release.apk
            path: android/app/build/outputs/apk/release/app-release.apk


    create-release:
      needs: [build-android, deploy]
      runs-on: ubuntu-latest

      steps:
        - name: Baixar APK gerado 
          uses: actions/download-artifact@v4
          with:
            name: app-release

        - name: Criar GitHub release 
          uses: softprops/action-gh-release@v2
          with:
            tag_name: v${{ github.run_number }}
            name: Release v${{ github.run_number }}
            draft: false
            prerelease: false
            files: app-release.apk
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}













    